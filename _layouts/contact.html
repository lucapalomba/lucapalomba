---
layout: default
---
{%- assign t = site.data.translations[page.lang] %}
<!-- Main Content -->
<main class="page contact-content" id="main-content">
    <div class="container">
        <h1 class="section-title"><span class="section-number">04.</span> <span class="section-title-text">{{ t.contact.title }}</span></h1>
        <p class="contact-description">{{ t.contact.description }}</p>

        <a href="mailto:luca.palomba.developer@gmail.com" class="contact-email">
            luca.palomba.developer@gmail.com
        </a>

        <div class="social-links">
            <a href="https://github.com/lucapalomba" target="_blank" rel="noopener noreferrer"
                aria-label="{{ t.a11y.github }}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                    </path>
                </svg>
            </a>
            <a href="https://www.linkedin.com/in/lucapalomba/" target="_blank" rel="noopener noreferrer"
                aria-label="{{ t.a11y.linkedin }}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                    <rect x="2" y="9" width="4" height="12"></rect>
                    <circle cx="4" cy="4" r="2"></circle>
                </svg>
            </a>
        </div>
    </div>
</main>
<!-- ContactPage structured data. The Person properties come from the shared
     fragment fed by _data/person.yml (same source as the root JSON-LD in
     head.html) instead of being repeated here, so the two can never drift;
     `description` is overridden with the localized bio. `inLanguage` belongs on
     this node — ContactPage is a WebPage, and `inLanguage` is valid there — not
     on the nested Person, which is not a domain of it. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ContactPage",
  "inLanguage": {{ page.lang | jsonify }},
  "mainEntity": {
    {% include jsonld-person-props.html description=t.index.hero.bio %}
  }
}
</script>
