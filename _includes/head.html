<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Mark JS availability before CSS applies, so the fade-in only hides content for JS users -->
<script>document.documentElement.classList.add('js')</script>
<title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
<meta name="description"
  content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">

<!-- Favicon / icons (local, no external dependency) -->
<link rel="icon" href="{{ '/images/favicon-32.png' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/images/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ '/images/icon-192.png' | relative_url }}" sizes="180x180">
<link rel="shortcut icon" href="{{ '/images/favicon-32.png' | relative_url }}">
<meta name="theme-color" content="#0a0a0f">

<!-- Preload critical fonts and CSS -->
<link rel="preload" href="{{ '/fonts/Roboto_Mono/static/RobotoMono-Regular.ttf' | relative_url }}" as="font"
  type="font/ttf" crossorigin>
<link rel="preload" href="{{ '/styles/main.css' | relative_url }}" as="style">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

<!-- Web App Manifest -->
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">


<!-- SEO & Social Media -->
<meta property="og:title"
  content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta property="og:description"
  content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/icon-512.png' | absolute_url }}">
<meta property="og:image:width" content="460">
<meta property="og:image:height" content="460">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title"
  content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta name="twitter:description"
  content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<meta name="twitter:image" content="{{ '/images/icon-512.png' | absolute_url }}">

<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Schema.org JSON-LD Structured Data (Person props from _data/person.yml) -->
<script type="application/ld+json">
{"@context": "https://schema.org", {% include jsonld-person-props.html %}}
</script>

{% if page.header_scripts %}
{{ page.header_scripts }}
{% endif %}

<!-- Fonts -->
<link rel="stylesheet" href="{{ '/styles/fonts.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/styles/transitions.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/styles/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/styles/mobile.css' | relative_url }}" media="(max-width: 768px)">
<link rel="stylesheet" href="{{ '/styles/mobile-small.css' | relative_url }}" media="(max-width: 640px)">
<link rel="stylesheet" href="{{ '/styles/reduced-motion.css' | relative_url }}"
  media="(prefers-reduced-motion: reduce)">
<link rel="stylesheet" href="{{ '/styles/print-experiences.css' | relative_url }}" media="print">
