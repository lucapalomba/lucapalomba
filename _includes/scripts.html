<!-- Language preference: remembers which language the visitor picked with the switcher -->
<script src="{{ '/js/langPref.js' | relative_url }}" defer></script>

<!-- Non-critical: Defer particles and animations until after page is interactive -->
<script src="{{ '/js/particles.min.js' | relative_url }}" defer></script>
<script src="{{ '/js/main.js' | relative_url }}" defer></script>
<script src="{{ '/js/transitions.js' | relative_url }}" defer></script>

{% unless page.hide_nav_scripts %}
<script src="{{ '/js/navigation.js' | relative_url }}" defer></script>
<script src="{{ '/js/hamburger.js' | relative_url }}" defer></script>
{% endunless %}

{% if page.page_scripts %}
{% for script in page.page_scripts %}
<script src="{{ script | relative_url }}" defer></script>
{% endfor %}
{% endif %}

<script src="{{ '/js/backToTop.js' | relative_url }}" defer></script>
<script src="{{ '/js/motion.js' | relative_url }}" defer></script>

<!-- Console easter egg. Rendered from the locale dictionary instead of being
     fetched by the old client-side i18n loader, so the right language is always
     printed and no request is needed for it. -->
<script>
  console.log('%c' + {{ t.consoleEasterEgg | jsonify }}, 'font-size: 14px; font-family: monospace; color: #6e48aa; padding: 10px; border: 2px solid #6e48aa; border-radius: 5px;');
</script>

<!-- Service worker (PWA installability + offline shell). The `?v=` carries the
     build timestamp: a changed script URL is a new registration, so the browser
     installs the new worker and sw.js's activate step drops the old cache. No
     version constant to bump by hand. `relative_url` is required — baseurl is
     /lucapalomba on Pages but "" in the Lighthouse build and on localhost.
     Inline and in ES5 on purpose: jekyll-minifier runs this through Uglifier. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker
        .register('{{ "/sw.js" | relative_url }}?v={{ site.time | date: "%s" }}')
        .catch(function (error) {
          console.warn('[sw] registration failed', error);
        });
    });
  }
</script>
