<script>
  function updateLangToggleUI(lang) {
    const activeClass = ['text-secondary', 'font-bold'];
    const inactiveClass = ['text-text-muted', 'font-normal'];

    const btnEn = document.getElementById('lang-btn-en');
    const btnIt = document.getElementById('lang-btn-it');
    const mobBtnEn = document.getElementById('mob-lang-btn-en');
    const mobBtnIt = document.getElementById('mob-lang-btn-it');

    if (lang === 'en') {
      if(btnEn) {
        btnEn.classList.add(...activeClass); btnEn.classList.remove(...inactiveClass);
        btnIt.classList.add(...inactiveClass); btnIt.classList.remove(...activeClass);
      }
      if(mobBtnEn) {
        mobBtnEn.classList.add(...activeClass); mobBtnEn.classList.remove(...inactiveClass);
        mobBtnIt.classList.add(...inactiveClass); mobBtnIt.classList.remove(...activeClass);
      }
    } else {
      if(btnEn) {
        btnEn.classList.add(...inactiveClass); btnEn.classList.remove(...activeClass);
        btnIt.classList.add(...activeClass); btnIt.classList.remove(...inactiveClass);
      }
      if(mobBtnEn) {
        mobBtnEn.classList.add(...inactiveClass); mobBtnEn.classList.remove(...activeClass);
        mobBtnIt.classList.add(...activeClass); mobBtnIt.classList.remove(...inactiveClass);
      }
    }
  }

  // Set initial UI language on DOMContentLoaded
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const currentLang = window.i18n ? window.i18n.getCurrentLanguage() : 'en';
      updateLangToggleUI(currentLang);
    }, 100);

    // Mobile nav toggle interactions
    const menuToggle = document.getElementById('hamburger-toggle');
    const menuClose = document.getElementById('mobile-nav-close');
    const mobileNav = document.getElementById('mobile-nav');

    if (menuToggle && mobileNav) {
      menuToggle.addEventListener('click', () => {
        mobileNav.classList.remove('translate-x-full');
        menuToggle.setAttribute('aria-expanded', 'true');
      });
    }

    if (menuClose && mobileNav) {
      menuClose.addEventListener('click', () => {
        mobileNav.classList.add('translate-x-full');
        if (menuToggle) menuToggle.setAttribute('aria-expanded', 'false');
      });
    }

    // Close mobile nav when clicking a link
    const mobileLinks = mobileNav ? mobileNav.querySelectorAll('a') : [];
    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        if (mobileNav) mobileNav.classList.add('translate-x-full');
      });
    });
  });
</script>
