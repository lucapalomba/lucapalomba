name: Deploy Jekyll site to Pages

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: i18n integrity check
        run: node scripts/check-i18n.js

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      
      - name: Test site with HTML Proofer
        run: bundle exec htmlproofer ./_site --disable-external --swap-urls "^${{ steps.pages.outputs.base_path }}/:/"

      - name: Build for Lighthouse CI
        # Lighthouse only pays for main and pull requests targeting main;
        # plain feature-branch pushes get build + htmlproofer only.
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: bundle exec jekyll build --baseurl "" --destination ./_site_lhci
        env:
          JEKYLL_ENV: production

      - name: Run Lighthouse CI
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          npm install -g @lhci/cli@0.15.1
          echo "Starting Mobile Audit (Default)..."
          lhci autorun --collect.staticDistDir=./_site_lhci
          echo "Starting Desktop Audit..."
          lhci autorun --collect.settings.preset=desktop --collect.staticDistDir=./_site_lhci
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
