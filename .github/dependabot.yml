# Dependabot version updates.
#
# Scope: this file controls *scheduled version* updates only. Security updates
# are a repository setting (already enabled here) and are not configured by this
# file. Note that neither mechanism could have resolved Dependabot alert #26,
# where smol-toml was pinned to an exact version by its parent: Dependabot will
# not override a parent's constraint. That class of alert still needs a manual
# `overrides` entry in package.json.
#
# Grouping protects the one-PR-at-a-time validation workflow: minor and patch
# bumps arrive as a single PR per ecosystem, while major bumps stay out of the
# groups and arrive alone for a deliberate review. That is intentional --
# html-proofer and jekyll-minifier both have majors that break the CI gate.
#
# The commit prefix is explicit because Dependabot's default commit messages are
# derived from the repository's history rather than being fixed, so they would
# not reliably satisfy the Conventional Commits rule.

version: 2
updates:
  # The workflows that build, test and deploy the site.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]

  # Jekyll gems. CI runs `bundle exec jekyll build`, not the native Pages build,
  # so every gem PR goes through the real gate: build, htmlproofer, Lighthouse.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "ruby"]
    # The `json < 3` ceiling in the Gemfile is not enough on its own: for a
    # direct dependency, Dependabot treats the requirement as part of the update
    # and rewrites the bound itself, so it proposed json 3.0.2 by loosening
    # `< 3` to `< 4` (PR #137). json 3 dropped the `create_additions` keyword
    # that htmlcompressor -- a jekyll-minifier dependency -- passes to
    # JSON.parse, which kills `bundle exec jekyll build` inside
    # compress_javascript. The ignore below is the half Dependabot cannot edit.
    # `update-types` is the documented, ecosystem-agnostic way to say "no major
    # bumps for this gem" -- the ranges in a `versions` entry would have to be
    # written in RubyGems' own notation, and getting that wrong fails silently.
    # Only major updates are ignored, so json 2.x patches still come through,
    # and `update-types` governs version updates only -- a json security update
    # would still open its own PR.
    # Remove it together with the Gemfile ceiling once jekyll-minifier can move
    # to 0.2.x, which swaps the JS compressor for terser. That is blocked:
    # 0.2.x requires jekyll ~> 4.0, while github-pages pins jekyll 3.10.0.
    ignore:
      - dependency-name: "json"
        update-types: ["version-update:semver-major"]
    groups:
      gems-patch:
        patterns: ["*"]
        update-types: ["patch"]
      gems-minor:
        patterns: ["*"]
        update-types: ["minor"]

  # Dev-only tooling: markdownlint-cli2 and its tree.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies"]
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minor:
        patterns: ["*"]
        update-types: ["minor"]
